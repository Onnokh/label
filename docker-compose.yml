# Coolify-friendly compose file for the Sleevy monorepo.
#
# Coolify resolves SERVICE_FQDN_* variables to the public URL it assigns to a
# service and exposes a container by matching its internal port. Set the per-
# service domains in Coolify.
#
# Required env (set in Coolify "Environment Variables"):
#   POSTGRES_PASSWORD            - Postgres superuser password
#   BETTER_AUTH_SECRET           - 32+ char random string
#   GOOGLE_CLIENT_ID / SECRET    - Google OAuth credentials
#   APPLE_*                      - Apple sign-in credentials
#
# Auto-injected by Coolify from the domains you set on each service:
#   SERVICE_URL_API              - public API URL (e.g. https://api.sleevy.app)
#   SERVICE_URL_WEB              - public web URL (e.g. https://sleevy.app)

# Every service below states start_interval next to its interval. Coolify
# removes the old containers before it creates the new ones, so a deploy is a
# gap in service, and depends_on makes that gap the sum of the chain: postgres,
# then redis, then api, then web, each waiting on the one before to report
# healthy. interval alone is the delay before the *first* probe as well as the
# spacing between later ones, so four services at 10s spend most of the gap
# waiting to be asked. start_interval is the spacing that applies only while a
# container is still inside start_period, which is exactly the window that
# decides how fast the chain resolves.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sleevy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sleevy}
      POSTGRES_DB: sleevy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleevy -d sleevy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgres://sleevy:${POSTGRES_PASSWORD:-sleevy}@postgres:5432/sleevy
      REDIS_URL: redis://redis:6379
      # Standard libpq env so any pg client constructed without a connection
      # string (e.g. inside better-auth or other deps) still hits Postgres
      # instead of falling back to localhost.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: sleevy
      PGPASSWORD: ${POSTGRES_PASSWORD:-sleevy}
      PGDATABASE: sleevy
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Shared with the web service below. A Server-Side Render of a public page
      # states this secret and is left out of the Public Profile Rate Limit, so a
      # visitor who opens a page always gets the page. Unset means every caller
      # is treated as a public API client.
      INTERNAL_RENDER_TOKEN: ${INTERNAL_RENDER_TOKEN:-}
      BETTER_AUTH_URL: ${SERVICE_URL_API:-http://localhost:3002}
      BETTER_AUTH_TRUSTED_ORIGINS: ${SERVICE_URL_WEB:-http://localhost:8080}
      SLEEVY_WEB_URL: ${SERVICE_URL_WEB:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_APP_BUNDLE_IDENTIFIER: ${APPLE_APP_BUNDLE_IDENTIFIER:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${CLOUDFLARE_CACHE_PURGE_API_TOKEN:-}
      RYBBIT_ENABLED: ${RYBBIT_ENABLED:-false}
      RYBBIT_API_URL: ${RYBBIT_API_URL:-}
      RYBBIT_SITE_ID: ${RYBBIT_SITE_ID:-}
      RYBBIT_API_KEY: ${RYBBIT_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    expose:
      - "3002"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${SERVICE_URL_API:-http://localhost:3002}
        VITE_WEB_BASE_URL: ${SERVICE_URL_WEB:-http://localhost:8080}
        VITE_RYBBIT_SITE_ID: ${RYBBIT_SITE_ID:-}
        VITE_RYBBIT_SCRIPT_SRC: ${VITE_RYBBIT_SCRIPT_SRC:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The API as this container reaches it. VITE_API_BASE_URL above is a build
      # argument baked into the browser bundle and holds the public address, so
      # a server-side render that used it would leave the network and come back
      # through the proxy. This one keeps that call on the compose network.
      INTERNAL_API_BASE_URL: http://api:3002
      # The same secret the api service holds, stated on every public read a
      # render makes.
      INTERNAL_RENDER_TOKEN: ${INTERNAL_RENDER_TOKEN:-}
      # IndexNow ownership key. It is intentionally served publicly at
      # /<key>.txt so the protocol can verify domain ownership.
      INDEXNOW_KEY: ${INDEXNOW_KEY:-e71501ace20aafcc1c8d1fa9b232b117}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun --eval \"const response = await fetch('http://localhost:3000/health'); process.exit(response.ok ? 0 : 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    expose:
      - "3000"

volumes:
  postgres-data:
  redis-data:
